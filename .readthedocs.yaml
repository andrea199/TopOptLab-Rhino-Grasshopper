version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - python tools/manual/build.py
        - python tools/manual/check.py
        - python tools/manual/check_course.py
        - python tools/manual/export_site.py --output "$READTHEDOCS_OUTPUT/html"
